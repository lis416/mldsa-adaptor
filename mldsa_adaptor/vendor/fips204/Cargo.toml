# Fork of fips204 0.4.6 (integritychain, MIT OR Apache-2.0).
# Only change: new module src/adaptor.rs (+ one `pub mod adaptor;` line in lib.rs).
# KeyGen / Sign / Verify code paths are untouched. See FORK_NOTES.md.
[package]
name = "fips204"
version = "0.4.6"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
autotests = false
autobenches = false

[features]
default = ["default-rng", "ml-dsa-44", "ml-dsa-65", "ml-dsa-87"]
default-rng = ["rand_core/getrandom"]
ml-dsa-44 = []
ml-dsa-65 = []
ml-dsa-87 = []
dudect = []

[dependencies]
rand_core = { version = "0.6.4", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
sha3 = { version = "0.10.2", default-features = false }
zeroize = { version = "1.6.0", default-features = false, features = ["zeroize_derive"] }
